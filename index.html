<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角形內角和探索</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
      color: #333;
      line-height: 1.7;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      border-bottom: 3px solid #3498db;
      padding-bottom: 10px;
    }
    h2 {
      color: #2980b9;
    }
    .task-box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin: 20px 0;
    }
    .angles {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      font-size: 1.2em;
    }
    .angle {
      text-align: center;
      background: #ecf0f1;
      padding: 15px 25px;
      border-radius: 8px;
    }
    .sum {
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      color: #e74c3c;
      margin: 25px 0;
    }
    .note {
      background: #fff8e1;
      padding: 15px;
      border-left: 5px solid #f39c12;
      margin-top: 20px;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #7f8c8d;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>三角形內角和探索</h1>
  <p style="text-align:center; color:#7f8c8d;">拖動頂點，發現三角形角度的規律</p>

  <div class="task-box">
    <h2>探索任務</h2>
    <p>拖動三角形的三個頂點，改變它的形狀。觀察三個內角分別是多少，再看看它們的和有沒有發生變化。</p>

    <div class="angles">
      <div class="angle"><strong>60°</strong><br>角 A</div>
      <div class="angle"><strong>60°</strong><br>角 B</div>
      <div class="angle"><strong>60°</strong><br>角 C</div>
    </div>

    <div class="sum">三個內角的和：<strong>180°</strong></div>

    <p>試著把三角形變成不同的形狀，看看內角和是否改變。</p>
    <p>拖動任意一個頂點開始探索。</p>
  </div>

  <div class="note">
    <strong>發現規律：</strong>不論三角形的形狀如何改變，三個內角的和始終是 <strong>180°</strong>。
  </div>

  <footer>
